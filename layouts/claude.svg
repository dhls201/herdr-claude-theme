<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- Canvas Background -->
  <rect width="320" height="200" fill="#141413"/>
  
  <!-- Sidebar (Chrome) -->
  <rect x="0" y="0" width="76" height="200" fill="#1b1a19"/>
  <line x1="76" y1="0" x2="76" y2="200" stroke="#2e2d29" stroke-width="1"/>
  
  <!-- Traffic lights -->
  <circle cx="12" cy="14" r="3" fill="#ff5f56"/>
  <circle cx="20" cy="14" r="3" fill="#ffbd2e"/>
  <circle cx="28" cy="14" r="3" fill="#27c93f"/>
  
  <!-- Claude brand icon / star -->
  <path d="M 46 14 L 48 10 L 50 14 L 54 16 L 50 18 L 48 22 L 46 18 L 42 16 Z" fill="#d97757"/>
  
  <!-- Spaces items -->
  <rect x="8" y="32" width="60" height="14" rx="4" fill="#242321"/>
  <rect x="12" y="37" width="4" height="4" rx="1" fill="#d97757"/>
  <rect x="20" y="37" width="32" height="4" rx="1" fill="#faf9f5"/>
  
  <rect x="8" y="50" width="60" height="14" rx="4" fill="transparent"/>
  <rect x="12" y="55" width="4" height="4" rx="1" fill="#788c5d"/>
  <rect x="20" y="55" width="28" height="4" rx="1" fill="#b0aea5"/>

  <rect x="8" y="68" width="60" height="14" rx="4" fill="transparent"/>
  <rect x="12" y="73" width="4" height="4" rx="1" fill="#6a9bcc"/>
  <rect x="20" y="73" width="36" height="4" rx="1" fill="#b0aea5"/>

  <!-- Agents Section -->
  <line x1="8" y1="92" x2="68" y2="92" stroke="#2e2d29" stroke-width="1"/>
  <rect x="10" y="100" width="24" height="3" rx="1" fill="#73716a"/>
  
  <rect x="8" y="108" width="60" height="18" rx="4" fill="#242321"/>
  <circle cx="15" cy="117" r="3" fill="#d97757"/>
  <rect x="22" y="115" width="30" height="4" rx="1" fill="#faf9f5"/>

  <!-- Work Area -->
  <!-- Tab bar -->
  <rect x="76" y="0" width="244" height="28" fill="#141413"/>
  <rect x="84" y="6" width="64" height="18" rx="5" fill="#242321" stroke="#d97757" stroke-width="1"/>
  <rect x="92" y="13" width="32" height="4" rx="1" fill="#faf9f5"/>
  <rect x="152" y="6" width="52" height="18" rx="5" fill="#1b1a19"/>
  <rect x="160" y="13" width="28" height="4" rx="1" fill="#73716a"/>
  
  <!-- Active Pane Card -->
  <rect x="84" y="32" width="228" height="152" rx="8" fill="#1c1b1a" stroke="#d97757" stroke-width="1"/>
  
  <!-- Pane Header -->
  <path d="M 85 33 Q 85 33 85 33 L 311 33 Q 311 33 311 33 L 311 48 L 85 48 Z" fill="#242321"/>
  <rect x="92" y="38" width="40" height="4" rx="1" fill="#b0aea5"/>
  <line x1="85" y1="48" x2="311" y2="48" stroke="#2e2d29" stroke-width="1"/>
  
  <!-- Terminal Prompt & Code lines -->
  <rect x="94" y="58" width="12" height="4" rx="1" fill="#d97757"/>
  <rect x="110" y="58" width="80" height="4" rx="1" fill="#faf9f5"/>
  
  <rect x="94" y="70" width="140" height="4" rx="1" fill="#788c5d"/>
  <rect x="94" y="80" width="100" height="4" rx="1" fill="#b0aea5"/>
  <rect x="94" y="90" width="160" height="4" rx="1" fill="#b0aea5"/>
  <rect x="94" y="102" width="120" height="4" rx="1" fill="#6a9bcc"/>
  
  <rect x="94" y="118" width="8" height="4" rx="1" fill="#d97757"/>
  <rect x="106" y="118" width="6" height="8" rx="1" fill="#d97757"/>
  
  <!-- Status bar -->
  <rect x="76" y="188" width="244" height="12" fill="#1b1a19"/>
  <rect x="84" y="192" width="30" height="4" rx="1" fill="#73716a"/>
  <rect x="280" y="192" width="28" height="4" rx="1" fill="#788c5d"/>
</svg>
